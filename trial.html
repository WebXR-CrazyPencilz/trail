<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Image Viewer</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
                color: white; font-family: sans-serif; font-size: 14px;
                background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="info">Click & drag to look around</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ✅ Use a direct equirectangular image URL (must allow CORS)
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
            'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Above_Gotham.jpg/2560px-Above_Gotham.jpg', // replace with your image
            (texture) => {
                const geometry = new THREE.SphereGeometry(500, 60, 40);
                geometry.scale(-1, 1, 1);
                const material = new THREE.MeshBasicMaterial({ map: texture });
                scene.add(new THREE.Mesh(geometry, material));
            },
            undefined,
            (err) => console.error('Texture failed to load (likely CORS):', err)
        );

        camera.position.set(0, 0, 0);

        // ✅ Drag controls
        let isPointerDown = false;
        let pointerX = 0, pointerY = 0;
        let lon = 0, lat = 0;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            isPointerDown = true;
            pointerX = e.clientX;
            pointerY = e.clientY;
        });
        window.addEventListener('pointerup', () => isPointerDown = false);
        window.addEventListener('pointermove', (e) => {
            if (!isPointerDown) return;
            lon -= (e.clientX - pointerX) * 0.15;
            lat += (e.clientY - pointerY) * 0.15;
            lat = Math.max(-85, Math.min(85, lat));
            pointerX = e.clientX;
            pointerY = e.clientY;
        });

        // Touch support
        let lastTouchX = 0, lastTouchY = 0;
        renderer.domElement.addEventListener('touchstart', (e) => {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            lon -= (e.touches[0].clientX - lastTouchX) * 0.15;
            lat += (e.touches[0].clientY - lastTouchY) * 0.15;
            lat = Math.max(-85, Math.min(85, lat));
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            // Convert lat/lon to camera look direction
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            camera.lookAt(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
