<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }

        #loader {
            position: absolute; inset: 0;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-family: sans-serif;
            z-index: 10;
        }
        #loader-bar-bg {
            width: 220px; height: 4px;
            background: #333; border-radius: 2px; margin-top: 16px;
        }
        #loader-bar {
            height: 100%; width: 0%;
            background: white; border-radius: 2px;
            transition: width 0.2s;
        }
        #loader-text { font-size: 13px; margin-top: 10px; opacity: 0.6; }

        #info {
            position: absolute; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            color: white; font-family: sans-serif; font-size: 13px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(6px);
            padding: 8px 18px; border-radius: 20px;
            pointer-events: none; opacity: 1;
            transition: opacity 1s;
        }

        #zoom {
            position: absolute; right: 20px; top: 50%;
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 8px;
        }
        #zoom button {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(6px);
            border: none; border-radius: 50%;
            color: white; font-size: 20px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        #zoom button:hover { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div id="loader">
        <div style="font-size:15px;letter-spacing:2px;opacity:0.8">LOADING</div>
        <div id="loader-bar-bg"><div id="loader-bar"></div></div>
        <div id="loader-text">0%</div>
    </div>

    <div id="info">🖱 Drag to look around &nbsp;|&nbsp; Scroll to zoom</div>

    <div id="zoom">
        <button id="zoomIn" title="Zoom In">+</button>
        <button id="zoomOut" title="Zoom Out">−</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene    = new THREE.Scene();
        const camera   = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(devicePixelRatio);
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        const loader  = document.getElementById('loader');
        const bar     = document.getElementById('loader-bar');
        const barText = document.getElementById('loader-text');

        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
            'https://ik.imagekit.io/pwzaetheh/newfolder/master_bedroom_toilet.jpg?updatedAt=1777541687118',
            (texture) => {
                const geo = new THREE.SphereGeometry(500, 60, 40);
                geo.scale(-1, 1, 1);
                const mat = new THREE.MeshBasicMaterial({ map: texture });
                scene.add(new THREE.Mesh(geo, mat));
                loader.style.display = 'none';
                setTimeout(() => {
                    document.getElementById('info').style.opacity = '0';
                }, 4000);
            },
            (xhr) => {
                if (xhr.total) {
                    const pct = Math.round((xhr.loaded / xhr.total) * 100);
                    bar.style.width = pct + '%';
                    barText.textContent = pct + '%';
                }
            },
            (err) => {
                barText.textContent = '❌ Failed to load image (check URL / CORS)';
                console.error(err);
            }
        );

        camera.position.set(0, 0, 0);
        let fov = 75;
        let isDown = false, px = 0, py = 0, lon = 0, lat = 0;

        renderer.domElement.addEventListener('pointerdown', (e) => {
            isDown = true; px = e.clientX; py = e.clientY;
            renderer.domElement.style.cursor = 'grabbing';
        });
        window.addEventListener('pointerup', () => {
            isDown = false;
            renderer.domElement.style.cursor = 'grab';
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDown) return;
            lon -= (e.clientX - px) * 0.15;
            lat  = Math.max(-85, Math.min(85, lat + (e.clientY - py) * 0.15));
            px = e.clientX; py = e.clientY;
        });

        let lx = 0, ly = 0, lastPinchDist = null;
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
            if (e.touches.length === 2) lastPinchDist = null;
        });
        renderer.domElement.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                lon -= (e.touches[0].clientX - lx) * 0.15;
                lat  = Math.max(-85, Math.min(85, lat + (e.touches[0].clientY - ly) * 0.15));
                lx = e.touches[0].clientX; ly = e.touches[0].clientY;
            }
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (lastPinchDist !== null) {
                    fov = Math.max(30, Math.min(100, fov - (dist - lastPinchDist) * 0.1));
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                }
                lastPinchDist = dist;
            }
        }, { passive: false });

        window.addEventListener('wheel', (e) => {
            fov = Math.max(30, Math.min(100, fov + e.deltaY * 0.05));
            camera.fov = fov;
            camera.updateProjectionMatrix();
        });

        document.getElementById('zoomIn').addEventListener('click', () => {
            fov = Math.max(30, fov - 5);
            camera.fov = fov; camera.updateProjectionMatrix();
        });
        document.getElementById('zoomOut').addEventListener('click', () => {
            fov = Math.min(100, fov + 5);
            camera.fov = fov; camera.updateProjectionMatrix();
        });

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const phi   = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            camera.lookAt(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            renderer.render(scene, camera);
        }
        animate();
        renderer.domElement.style.cursor = 'grab';
    </script>
</body>
</html>
